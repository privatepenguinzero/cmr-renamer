[project]
name = "cmr-renamer"
dynamic = ["version"]
description = "A file watcher and renamer for CMR documents using OCR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "watchdog",
    "pillow",
    "pytesseract",
    "pdf2image",
    "PySide6-Essentials>=6.7",
]

[project.scripts]
cmr-renamer = "cmr_renamer.cli:run"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Unica fonte della versione: la legge anche l'aggiornamento automatico a runtime.
path = "cmr_renamer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cmr_renamer"]
